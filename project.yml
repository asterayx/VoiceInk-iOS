name: VoiceInk-ios

options:
  bundleIdPrefix: com.asterayx.VoiceInk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit
    from: "9.9.0"

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    MTL_FAST_MATH: "YES"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      ENABLE_TESTABILITY: "YES"
      ONLY_ACTIVE_ARCH: "YES"
      GCC_PREPROCESSOR_DEFINITIONS: "DEBUG=1"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      ENABLE_NS_ASSERTIONS: "NO"
      VALIDATE_PRODUCT: "YES"
      MTL_ENABLE_DEBUG_INFO: "NO"

targets:
  VoiceInk-ios:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VoiceInk-ios
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asterayx.VoiceInk
        PRODUCT_NAME: VoiceInk
        CODE_SIGN_ENTITLEMENTS: VoiceInk-ios/VoiceInk_ios.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VoiceInk-ios/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Voice Ink"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "This app records audio to transcribe into notes."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        STRING_CATALOG_GENERATE_SYMBOLS: "YES"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "YES"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_OBJC_BRIDGING_HEADER: VoiceInk-ios/VoiceInk-ios-Bridging-Header.h
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - framework: Frameworks/whisper.xcframework
        embed: true
      - sdk: Translation.framework
      - target: VoiceInkKeyboard

  VoiceInkKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.5"
    sources:
      - path: VoiceInkKeyboard
        excludes:
          - Info.plist
      - path: VoiceInk-ios/AppGroupCoordinator.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asterayx.VoiceInk.VoiceInkKeyboard
        PRODUCT_NAME: $(TARGET_NAME)
        CODE_SIGN_ENTITLEMENTS: VoiceInkKeyboard/VoiceInkKeyboard.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VoiceInkKeyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: VoiceInkKeyboard
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SKIP_INSTALL: "YES"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SWIFT_VERSION: "5.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - package: KeyboardKit

  VoiceInk-iosTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VoiceInk-iosTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asterayx.VoiceInk.Tests
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: "YES"
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    dependencies:
      - target: VoiceInk-ios

  VoiceInk-iosUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - VoiceInk-iosUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.asterayx.VoiceInk.UITests
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: "YES"
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
        SWIFT_EMIT_LOC_STRINGS: "NO"
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    dependencies:
      - target: VoiceInk-ios
